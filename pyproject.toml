[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorygrad"
version = "0.1.0"
description = "Passive gradient memory for coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "MemoryGrad contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
memorygrad = "memorygrad.cli:main"
memgrad = "memorygrad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
