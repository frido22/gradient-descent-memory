[metadata]
name = memorygrad
version = 0.1.0
description = Passive gradient memory for coding agents.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    memorygrad = memorygrad.cli:main
    memgrad = memorygrad.cli:main

[options.extras_require]
dev =
    pytest>=8
